<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#191411"/>
      <stop offset="60%" stop-color="#0f0d0c"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>

    <!-- Warm Amber Gold Gradient matching reference -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3c6"/>
      <stop offset="40%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#c98e50"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e0a96d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Golden Envelope with Cursive Ribbon Loop -->
  <g transform="translate(256, 230)" filter="url(#softGlow)">
    
    <!-- Envelope Body -->
    <rect x="-165" y="-120" width="330" height="215" rx="28" 
          fill="none" 
          stroke="url(#gold)" 
          stroke-width="19" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Envelope Top Flap Folds (Smooth V-Dip with rounded center) -->
    <path d="M -156, -110 
             L -20, 2 
             C -8, 12 8, 12 20, 2 
             L 156, -110" 
          fill="none" 
          stroke="url(#gold)" 
          stroke-width="19" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Left & Right Diagonal Seams -->
    <path d="M -155, 85 L -35, -12" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 155, 85 L 35, -12" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>

    <!-- Playful Cursive Loop-de-Loop Ribbon Flourish on Bottom Right -->
    <path d="
      M 40, 95
      C 10, 95 10, 155 85, 155
      C 160, 155 185, 95 125, 95
      C 70, 95 40, 160 145, 155
      C 195, 152 205, 175 160, 205
      C 125, 225 105, 195 140, 165
      C 165, 145 200, 165 215, 168
    " 
    fill="none" 
    stroke="url(#gold)" 
    stroke-width="18" 
    stroke-linecap="round" 
    stroke-linejoin="round"/>

  </g>
</svg>
